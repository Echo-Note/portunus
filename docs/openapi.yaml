# ════════════════════════════════════════════
# Components
# ════════════════════════════════════════════
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DomainId:
      name: did
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UpstreamId:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TokenId:
      name: tid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [github, google]

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 资源冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: 内部服务器错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: Caddy 不可达
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ── 基础响应 ──
    BaseResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            code:
              type: integer
              example: 40301
            message:
              type: string
              example: 无权限执行此操作

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
        uptime:
          type: integer

    # ── 认证 ──
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 64
          description: 至少 8 位，含字母和数字

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                access_token:
                  type: string
                  description: JWT access token（15min 有效期）
                refresh_token:
                  type: string
                  description: refresh token（7d 有效期）
                user:
                  $ref: '#/components/schemas/User'

    # ── 用户 ──
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/UserStatus'
        email_verified:
          type: boolean
        oauth_provider:
          type: string
          nullable: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    UserStatus:
      type: string
      enum: [pending, active, suspended, deleted]

    UserResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'

    UpdateUserRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 8
        oauth_provider:
          type: string

    # ── API Token ──
    ApiToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token_prefix:
          type: string
          example: tok_abc1****
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, revoked, expired]
        created_at:
          type: string
          format: date-time

    CreateTokenRequest:
      type: object
      required: [name, project_id]
      properties:
        name:
          type: string
          maxLength: 255
        project_id:
          type: string
          format: uuid
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
        ip_whitelist:
          type: array
          items:
            type: string

    CreateTokenResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
                  description: Token 明文，仅展示一次
                id:
                  type: string
                  format: uuid
                token_prefix:
                  type: string

    # ── 项目 ──
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          description: 短 ID，用于 @id 前缀
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatus'
        repository:
          type: object
          properties:
            url:
              type: string
            branch:
              type: string
        ports:
          type: object
          properties:
            exposed:
              type: integer
            internal:
              type: integer
        environment:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: string
        caddy_server_id:
          type: string
        default_ssl_mode:
          type: string
          enum: [auto, none, provided]
          default: auto
        plan:
          type: string
        limits:
          type: object
          properties:
            cpu:
              type: string
            memory:
              type: string
            storage:
              type: string
        member_count:
          type: integer
        domain_count:
          type: integer
        max_domains:
          type: integer
        max_members:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectStatus:
      type: string
      enum: [active, suspended, deleting, error, deleted]

    ProjectResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Project'

    ProjectListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Project'
                total:
                  type: integer
                page:
                  type: integer
                size:
                  type: integer

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        repository:
          type: object
          properties:
            url:
              type: string
            branch:
              type: string
        ports:
          type: object
          properties:
            exposed:
              type: integer
            internal:
              type: integer
        environment:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: string
        caddy_server_id:
          type: string
        default_ssl_mode:
          type: string
          enum: [auto, none, provided]
          default: auto
        plan:
          type: string
        limits:
          type: object
          properties:
            cpu:
              type: string
            memory:
              type: string
            storage:
              type: string

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        repository:
          type: object
          properties:
            url:
              type: string
            branch:
              type: string
        ports:
          type: object
          properties:
            exposed:
              type: integer
            internal:
              type: integer
        environment:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: string
        caddy_server_id:
          type: string
        default_ssl_mode:
          type: string
          enum: [auto, none, provided]
        plan:
          type: string
        limits:
          type: object
          properties:
            cpu:
              type: string
            memory:
              type: string
            storage:
              type: string

    # ── 成员 ──
    MemberRole:
      type: string
      enum: [owner, admin, editor, viewer]

    MemberStatus:
      type: string
      enum: [pending, active, removed, left]

    ProjectMember:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: '#/components/schemas/MemberRole'
        status:
          $ref: '#/components/schemas/MemberStatus'
        joined_at:
          type: string
          format: date-time
          nullable: true
        invited_by:
          type: string
          format: uuid
          nullable: true

    MemberListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/ProjectMember'
                total:
                  type: integer
                page:
                  type: integer
                size:
                  type: integer

    InviteMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, editor, viewer]

    # ── 域名 ──
    DomainStatus:
      type: string
      enum: [creating, active, updating, disabled, error, deleting, deleted]

    Domain:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        domain_name:
          type: string
        caddy_id:
          type: string
          description: Caddy 配置中的 @id
        status:
          $ref: '#/components/schemas/DomainStatus'
        ssl_enabled:
          type: boolean
          default: true
        upstream_count:
          type: integer
        is_shared:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DomainResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Domain'

    DomainListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Domain'
                total:
                  type: integer
                page:
                  type: integer
                size:
                  type: integer

    CreateDomainRequest:
      type: object
      required: [domain_name, upstreams]
      properties:
        domain_name:
          type: string
          pattern: '^[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*$'
        upstreams:
          type: array
          minItems: 1
          items:
            type: object
            required: [dial_address]
            properties:
              dial_address:
                type: string
                pattern: '^[a-zA-Z0-9.-]+:[0-9]+$'
              weight:
                type: integer
                default: 1
              max_requests:
                type: integer
        lb_policy:
          type: string
          enum: [random, round_robin, least_conn, ip_hash, uri_hash]
          default: random
        headers:
          type: object
          additionalProperties: true

    UpdateDomainRequest:
      type: object
      properties:
        status:
          type: string
          enum: [active, disabled]

    # ── 代理配置 ──
    ProxyConfig:
      type: object
      properties:
        lb_policy:
          type: string
          enum: [random, round_robin, least_conn, ip_hash, uri_hash]
        upstreams:
          type: array
          items:
            $ref: '#/components/schemas/Upstream'
        health_check:
          type: object
          properties:
            interval:
              type: string
              example: 10s
            timeout:
              type: string
              example: 5s
            fail_threshold:
              type: integer
              default: 3
        headers:
          type: object

    ProxyConfigResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ProxyConfig'

    UpdateProxyRequest:
      type: object
      properties:
        lb_policy:
          type: string
          enum: [random, round_robin, least_conn, ip_hash, uri_hash]
        health_check:
          type: object
        headers:
          type: object

    Upstream:
      type: object
      properties:
        id:
          type: string
          format: uuid
        dial_address:
          type: string
          example: 10.0.0.1:8080
        weight:
          type: integer
          default: 1
        max_requests:
          type: integer
          nullable: true
        status:
          type: string
          enum: [active, unhealthy, disabled, removed]

    UpstreamResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Upstream'

    AddUpstreamRequest:
      type: object
      required: [dial_address]
      properties:
        dial_address:
          type: string
          pattern: '^[a-zA-Z0-9.-]+:[0-9]+$'
        weight:
          type: integer
          default: 1
        max_requests:
          type: integer

    HealthStatusResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                overall:
                  type: string
                  enum: [active, updating, degraded, unavailable]
                upstreams:
                  type: array
                  items:
                    type: object
                    properties:
                      dial_address:
                        type: string
                      healthy:
                        type: boolean
                      last_check:
                        type: string
                        format: date-time

    # ── 共享 ──
    ShareStatus:
      type: string
      enum: [pending, active, revoked, expired, rejected]

    Share:
      type: object
      properties:
        id:
          type: string
          format: uuid
        domain_id:
          type: string
          format: uuid
        domain_name:
          type: string
        source_project_id:
          type: string
          format: uuid
        source_project_name:
          type: string
        target_project_id:
          type: string
          format: uuid
        permission:
          type: string
          enum: [read_only, edit]
        status:
          $ref: '#/components/schemas/ShareStatus'
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    ShareResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Share'

    CreateShareRequest:
      type: object
      required: [target_project_id]
      properties:
        target_project_id:
          type: string
          format: uuid
        permission:
          type: string
          enum: [read_only, edit]
          default: read_only
        expires_at:
          type: string
          format: date-time

    # ── 审计日志 ──
    AuditLog:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: string
          format: uuid
        user_email:
          type: string
        action:
          type: string
          enum: [create, update, delete, read]
        resource_type:
          type: string
          enum: [project, domain, proxy, upstream, member, share, token, invitation]
        resource_id:
          type: string
        caddy_id:
          type: string
          nullable: true
        ip_address:
          type: string
        user_agent:
          type: string
        mcp_tool_name:
          type: string
          nullable: true
        result:
          type: string
          enum: [success, failure]
        request_body:
          type: object
          nullable: true
        response_status:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time

    AuditLogListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/AuditLog'
                total:
                  type: integer
                page:
                  type: integer
                size:
                  type: integer

    # ── 邀请 ──
    Invitation:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        project_name:
          type: string
        inviter_email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, editor, viewer]
        expires_at:
          type: string
          format: date-time

    InvitationResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Invitation'

    # ── 配置快照 ──
    Snapshot:
      type: object
      properties:
        version:
          type: string
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        comment:
          type: string

    SnapshotListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Snapshot'
                total:
                  type: integer
                page:
                  type: integer
                size:
                  type: integer

    # ── 密码找回 ──
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 64
          description: 至少 8 位，含字母和数字
