name: ✨ 功能请求
description: 提出一个新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出功能建议！请花几分钟描述你的想法。

  - type: textarea
    id: problem
    attributes:
      label: 这个功能解决什么问题？
      description: 清楚描述你遇到的问题或使用场景
      placeholder: |
        例如：当我在管理 50+ 域名时，很难快速找到特定域名的配置 ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方案
      description: 描述你希望看到的功能或改进
      placeholder: |
        例如：添加域名搜索和筛选功能，支持按名称、状态、标签过滤 ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 是否有其他方式可以解决这个问题？
      placeholder: 描述你考虑过的其他方案

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - Web UI (前端)
        - REST API (后端)
        - MCP Server
        - AI Agent
        - CLI
        - 部署/运维
        - 多个模块
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认事项
      options:
        - label: 我已经搜索了已有的 Issues，确认没有重复
          required: true
        - label: 这个功能与项目目标一致（多租户 Caddy 管理平台）
          required: true