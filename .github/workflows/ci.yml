name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# ── 全局配置 ──
env:
  GO_VERSION: '1.26'  # 与 go.mod 保持一致
  NODE_VERSION: '20'

# 取消同一 PR/分支上正在运行的旧 CI，避免资源浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write       # 仅 report-failure job 需要

jobs:
  # ═══════════════════════════════════════════════════════════════
  # 变更检测（跳过无关 job，节省 CI 分钟数）
  # ═══════════════════════════════════════════════════════════════
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ent-schema: ${{ steps.filter.outputs.ent-schema }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'ent/schema/**'
              - 'ent/migrate/**'
              - 'sqlc.yaml'
              - '.golangci.yml'
            frontend:
              - 'web/src/**'
              - 'web/public/**'
              - 'web/package.json'
              - 'web/package-lock.json'
              - 'web/tsconfig.json'
              - 'web/.eslintrc*'
            ent-schema:
              - 'ent/schema/**'
              - 'sqlc.yaml'

  # ═══════════════════════════════════════════════════════════════
  # 后端单元测试（需要 PostgreSQL — 部分测试依赖真实数据库）
  # ═══════════════════════════════════════════════════════════════
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portunus
          POSTGRES_PASSWORD: portunus
          POSTGRES_DB: portunus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://portunus:portunus@localhost:5432/portunus?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Create database schema
        run: |
          go run -mod=mod .github/scripts/migrate_schema.go
      - name: Run unit tests
        run: go test -race -cover -coverprofile=coverage.out ./internal/...
      - name: Check coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Coverage: ${COVERAGE}%"
          THRESHOLD=80
          if awk "BEGIN {exit !($COVERAGE < $THRESHOLD)}"; then
            echo "::error::Coverage ${COVERAGE}% is below ${THRESHOLD}% threshold"
            exit 1
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ═══════════════════════════════════════════════════════════════
  # 后端 lint
  # ═══════════════════════════════════════════════════════════════
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run --timeout=5m ./...
      - name: go vet
        run: go vet ./...

  # ═══════════════════════════════════════════════════════════════
  # 代码生成检查（仅 ent schema 变更时触发）
  # ═══════════════════════════════════════════════════════════════
  generate-check:
    name: sqlc Generate Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.ent-schema == 'true' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - name: Check generated code is up to date
        run: |
          sqlc generate -f sqlc.yaml
          if ! git diff --exit-code internal/repository/generated/; then
            echo "::error::Generated code is out of date. Run 'sqlc generate' and commit."
            exit 1
          fi

  # ═══════════════════════════════════════════════════════════════
  # 集成测试（仅后端代码变更时触发，依赖 PostgreSQL + Redis）
  # ═══════════════════════════════════════════════════════════════
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portunus
          POSTGRES_PASSWORD: portunus
          POSTGRES_DB: portunus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://portunus:portunus@localhost:5432/portunus_test?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run database schema migration
        run: go run -mod=mod .github/scripts/migrate_schema.go
      - name: Run integration tests
        run: go test -race -tags=integration -v ./test/integration/...

  # ═══════════════════════════════════════════════════════════════
  # 前端测试（仅前端文件变更时触发）
  # ═══════════════════════════════════════════════════════════════
  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        run: cd web && npm ci
      - name: Lint
        run: cd web && npm run lint
      - name: Test
        run: cd web && npm test -- --passWithNoTests
      - name: Build
        run: cd web && npm run build

  # ═══════════════════════════════════════════════════════════════
  # 构建（仅当所有必要检查通过后执行）
  # ═══════════════════════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [unit-test, lint, integration-test]
    # 即使某个 job 被路径过滤跳过，build 仍可继续
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build backend
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/portunus cmd/portunus/main.go
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portunus-binary
          path: bin/portunus

  # ═══════════════════════════════════════════════════════════════
  # 失败自动创建 Issue（仅 push 到 main/develop 时触发）
  # ═══════════════════════════════════════════════════════════════
  report-failure:
    name: Report Failure
    runs-on: ubuntu-latest
    needs: [unit-test, lint, generate-check, integration-test, frontend-test, build]
    if: |
      always() &&
      (github.event_name == 'push') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      contains(needs.*.result, 'failure')
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Create or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_UNIT_TEST: ${{ needs.unit-test.result }}
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_GENERATE_CHECK: ${{ needs.generate-check.result }}
          RESULT_INTEGRATION_TEST: ${{ needs.integration-test.result }}
          RESULT_FRONTEND_TEST: ${{ needs.frontend-test.result }}
          RESULT_BUILD: ${{ needs.build.result }}
        run: |
          set -eo pipefail

          # 收集失败 job 信息
          FAILED_JOBS=""
          append_if_failed() {
            if [ "${2:-}" = "failure" ]; then
              FAILED_JOBS="${FAILED_JOBS}- ${1}\n"
            fi
          }
          append_if_failed "unit-test"        "${RESULT_UNIT_TEST:-}"
          append_if_failed "lint"             "${RESULT_LINT:-}"
          append_if_failed "generate-check"   "${RESULT_GENERATE_CHECK:-}"
          append_if_failed "integration-test" "${RESULT_INTEGRATION_TEST:-}"
          append_if_failed "frontend-test"    "${RESULT_FRONTEND_TEST:-}"
          append_if_failed "build"            "${RESULT_BUILD:-}"

          # 获取失败 Job 的日志摘要
          FAILURE_LOGS=""
          RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          API_URL="https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/jobs"

          get_failure_logs() {
            local job_name="$1"
            local result="${2:-}"
            if [ "${result}" != "failure" ]; then
              return
            fi

            # 获取失败 job 的 ID
            local job_id
            job_id=$(gh api "${API_URL}" \
              --jq ".jobs[] | select(.name == \"${job_name}\") | .id" 2>/dev/null || echo "")

            if [ -z "${job_id}" ]; then
              return
            fi

            # 获取 job 的步骤信息，找出失败的步骤
            local failed_step
            failed_step=$(gh api "repos/${REPO}/actions/jobs/${job_id}" \
              --jq '.steps[] | select(.conclusion == "failure") | .name' 2>/dev/null | head -1 || echo "")

            # 下载日志，提取包含 error/fail/panic 的关键行（最多 15 行）
            local log_snippet
            log_snippet=$(gh api "repos/${REPO}/actions/jobs/${job_id}/logs" 2>/dev/null | \
              grep -iE '(error|Error|FAIL|panic|fatal)' | tail -15 || echo "(无法获取日志)")

            if [ -n "${log_snippet}" ]; then
              FAILURE_LOGS="${FAILURE_LOGS}
          **${job_name}**${failed_step:+ (${failed_step})}:
          \`\`\`
          ${log_snippet}
          \`\`\`
          "
            fi
          }

          get_failure_logs "Unit Test"        "${RESULT_UNIT_TEST:-}"
          get_failure_logs "Lint"             "${RESULT_LINT:-}"
          get_failure_logs "sqlc Generate Check" "${RESULT_GENERATE_CHECK:-}"
          get_failure_logs "Integration Test" "${RESULT_INTEGRATION_TEST:-}"
          get_failure_logs "Frontend Test"    "${RESULT_FRONTEND_TEST:-}"
          get_failure_logs "Build"            "${RESULT_BUILD:-}"

          LABEL="ci-failure"

          # 确保 label 存在
          gh label create "${LABEL}" --color "d73a4a" --description "CI 流水线自动创建的失败追踪" 2>/dev/null || true

          # 准备模板变量
          export BRANCH="${{ github.ref_name }}"
          export RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          export COMMIT_SHORT="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHORT:0:7}"
          export COMMIT_MSG="${{ github.event.head_commit.message }}"
          export ACTOR="${{ github.actor }}"
          export FAILED_JOBS
          export FAILURE_LOGS
          ISSUE_TITLE="CI Failure: ${{ github.workflow }} on ${BRANCH}"

          # 查找是否已有同分支的未关闭 failure issue
          EXISTING_ISSUE=$(gh issue list \
            --label "${LABEL}" \
            --state open \
            --search "${ISSUE_TITLE}" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "${EXISTING_ISSUE}" ]; then
            echo "Found existing issue #${EXISTING_ISSUE}, adding comment..."
            FAILED_JOBS_FMT=$(printf '%b' "${FAILED_JOBS}" | tr '\n' ' ')
            gh issue comment "${EXISTING_ISSUE}" --body-file - <<EOF
          ### ⚠️ 再次失败

          | 项目 | 详情 |
          |------|------|
          | **提交** | \`${COMMIT_SHORT}\` — ${COMMIT_MSG} |
          | **触发者** | @${ACTOR} |
          | **运行日志** | [查看详情](${RUN_URL}) |

          失败的 Job: ${FAILED_JOBS_FMT}

          ${FAILURE_LOGS}
          EOF
          else
            echo "Creating new failure issue..."
            envsubst < .github/ci-failure-issue-template.md | \
              gh issue create \
                --title "${ISSUE_TITLE}" \
                --label "${LABEL}" \
                --body-file -
          fi

  # ═══════════════════════════════════════════════════════════════
  # 成功后自动关闭之前 CI 失败创建的 Issue
  # ═══════════════════════════════════════════════════════════════
  close-failure-issue:
    name: Close Failure Issue
    runs-on: ubuntu-latest
    needs: [unit-test, lint, generate-check, integration-test, frontend-test, build]
    if: |
      always() &&
      (github.event_name == 'push') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close resolved failure issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail

          BRANCH="${{ github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ISSUE_TITLE="CI Failure: ${{ github.workflow }} on ${BRANCH}"

          # 查找同分支的未关闭 failure issue
          ISSUES=$(gh issue list \
            --label "ci-failure" \
            --state open \
            --search "${ISSUE_TITLE}" \
            --json number \
            --jq '.[].number')

          if [ -n "${ISSUES}" ]; then
            for num in ${ISSUES}; do
              echo "Closing issue #${num} — CI has recovered."
              gh issue comment "${num}" --body-file - <<EOF
          ### ✅ CI 已恢复

          最近的 CI 运行已成功通过。
          [查看运行详情](${RUN_URL})

          此 Issue 将自动关闭。
          EOF
              gh issue close "${num}" --reason "completed"
            done
          else
            echo "No open failure issues to close."
          fi