version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - sqlclosecheck
  settings:
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
          severity: warning
          disabled: false
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Echo-Note/portunus
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
